<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Programación de Vacaciones 2027</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Concepto: planilla de control de RR.HH., tabla densa y legible, estado visible por fila. */
:root{
  --bg:#f3f6f5; --panel:#ffffff; --fg:#14231f; --muted:#5b6b66; --line:#d7e0dd;
  --accent:#0b6b5c; --accent-fg:#ffffff; --accent-soft:#dff0ec;
  --ok:#17703f; --ok-soft:#e1f3e8; --warn:#9a5b00; --warn-soft:#fbefd9; --bad:#a3261f; --bad-soft:#fbe4e1;
  --lock:#e9eeec;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1815; --panel:#15231f; --fg:#e4efeb; --muted:#93a8a1; --line:#294039;
  --accent:#4fc4ae; --accent-fg:#06201a; --accent-soft:#1b3a33;
  --ok:#6fd49a; --ok-soft:#173826; --warn:#f0b75a; --warn-soft:#3b2d12; --bad:#f08a82; --bad-soft:#3d1a17; --lock:#1b2c27; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1815; --panel:#15231f; --fg:#e4efeb; --muted:#93a8a1; --line:#294039;
  --accent:#4fc4ae; --accent-fg:#06201a; --accent-soft:#1b3a33;
  --ok:#6fd49a; --ok-soft:#173826; --warn:#f0b75a; --warn-soft:#3b2d12; --bad:#f08a82; --bad-soft:#3d1a17; --lock:#1b2c27; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--font);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
h1{font-size:20px;line-height:1.25;margin:0;font-weight:600;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,select,input{font:inherit;color:var(--fg)}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:6px;padding:9px 14px;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.status .big{font-family:var(--mono);font-size:18px;font-weight:500}
.bar{flex:1 1 180px;height:8px;background:var(--lock);border-radius:4px;overflow:hidden;min-width:120px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.months{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:6px}
.months div{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.months span{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.months b{font-family:var(--mono);font-weight:500}
.filters{display:grid;grid-template-columns:2fr 1.3fr 1fr;gap:8px}
.filters input,.filters select{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;min-width:0}
.note{padding:10px 12px;border-radius:6px;background:var(--warn-soft);color:var(--warn);font-size:13px}
.note[hidden]{display:none}
.tablebox{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:860px}
th{position:sticky;top:0;background:var(--panel);text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n{font-family:var(--mono);color:var(--muted);width:56px}
td.nm{font-weight:500;min-width:220px}
td.sm{font-size:13px;color:var(--muted)}
td.date{white-space:nowrap}
.mes{display:flex;gap:6px;align-items:center;min-width:190px}
.mes select{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 8px;min-width:0}
.mes select.pend{border-color:var(--warn);background:var(--warn-soft)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.lock{background:var(--lock);color:var(--muted)}
.x{background:transparent;border:1px solid var(--line);border-radius:6px;padding:6px 8px;cursor:pointer;color:var(--bad);font-size:12px}
tr.done td.nm{color:var(--ok)}
.pager{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;color:var(--muted);font-size:13px}
.pager div{display:flex;gap:6px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;max-width:min(92vw,520px);z-index:20}
.toast[hidden]{display:none}
@media (max-width:720px){.filters{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

<script>
/* ============ CONFIGURACIÓN DE FIREBASE (pega aquí tus datos, ver Paso 3) ============ */
const firebaseConfig = {
  apiKey: "AIzaSyBTwnx3mSut8uMNYMz29ZBQkVJxBXRbzhc",
  authDomain: "vacaciones-2027-41c69.firebaseapp.com",
  projectId: "vacaciones-2027-41c69",
  storageBucket: "vacaciones-2027-41c69.firebasestorage.app",
  messagingSenderId: "183522897945",
  appId: "1:183522897945:web:9eb8e141cb5233158fba88"
};

const COLECCION = "vacaciones2027";
/* ======================================================================================= */

(function(){
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth(), fdb = firebase.firestore();
  const col = fdb.collection(COLECCION);
  const listo = auth.signInAnonymously().then(c => c.user.uid);   // cada navegador recibe un id anónimo

  const snapDoc = d => ({id:d.id, exists:d.exists, data:()=>d.data()});
  const db = {
    doc(p){ const ref = col.doc(p.split("/").pop()); return {
      /* Registro ATÓMICO: si ya existe y es de otra persona, lanza "duplicado" */
      claim: (d, uid) => fdb.runTransaction(async tx => {
        const cur = await tx.get(ref);
        if (cur.exists && cur.data().by !== uid) {
          const e = new Error("duplicado"); e.code = "duplicado"; e.mes = cur.data().mes; throw e;
        }
        tx.set(ref, d);
      }),
      get: async () => snapDoc(await ref.get()),
      delete: () => ref.delete()
    };},
    collection(){ return { onSnapshot:(ok,err)=>col.onSnapshot(s=>ok({docs:s.docs.map(snapDoc)}),err) }; }
  };
  const user = { id: () => listo, can: () => true, canEdit: () => false };
  const dl = { save: async ({filename,data}) => {
    const b = data instanceof Blob ? data : new Blob([data]);
    const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = filename;
    document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000);
  }};
  window.claude = { use: async n => ({db,user,downloads:dl}[n] || null) };
})();
</script>

<div class="wrap">
  <header>
    <div>
      <h1>Programación de vacaciones 2027</h1>
      <p class="sub">Dirección de Red de Salud Alto Amazonas · Personal nombrado y CAS</p>
    </div>
    <div class="actions">
      <button class="btn" id="btnXlsx" type="button">Descargar Excel consolidado</button>
    </div>
  </header>

  <div class="status" aria-live="polite">
    <span><span class="big" id="cProg">0</span> <span class="sub">de</span> <span class="big" id="cTot">0</span> <span class="sub">programados</span></span>
    <div class="bar" role="progressbar" aria-label="Avance de programación"><i id="barFill"></i></div>
    <span class="sub" id="liveState">Conectando…</span>
  </div>

  <div class="months" id="months" aria-label="Programados por mes"></div>

  <div class="filters">
    <input id="q" type="search" placeholder="Buscar por apellidos, nombres o microred" autocomplete="off" aria-label="Buscar">
    <select id="fMr" aria-label="Filtrar por microred"></select>
    <select id="fEst" aria-label="Filtrar por estado">
      <option value="">Todos</option><option value="pend">Pendientes</option><option value="ok">Programados</option>

  <div class="tablebox">

      <thead><tr><th>N°</th><th>Apellidos y nombres</th><th>Cargo</th><th>Régimen</th><th>Microred</th><th>Unidad / EE.SS.</th><th>Fecha CAS</th><th>Fecha nombramiento</th><th>T.P.</th><th>Mes programado</th></tr></thead>

</div>

const MESES = ["ENERO","FEBRERO","MARZO","ABRIL","MAYO","JUNIO","JULIO","AGOSTO","SETIEMBRE","OCTUBRE","NOVIEMBRE","DICIEMBRE"];
const PAGE = 50;
const $ = id => document.getElementById(id);
let db=null, uid=null, canWrite=false, canEdit=false, saved=new Map(), page=0, pending=new Set();

const norm = s => (s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const IDX = DATA.map(r => norm(r[2]+" "+r[5]));
const employeeKeys = new Set(DATA.map(r=>r[7]));
const microredes = [...new Set(DATA.map(r=>r[5]))].sort((a,b)=>a.localeCompare(b,"es"));
$("fMr").innerHTML = '<option value="">Todas las microredes</option>' + microredes.map(m=>`<option>${m}</option>`).join("");
$("cTot").textContent = DATA.length;

function toast(t){ const el=$("toast"); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,3500); }

function filtered(){
  const toks = norm($("q").value).split(/\s+/).filter(Boolean), mr=$("fMr").value, est=$("fEst").value;
  const out=[];
  for(let i=0;i<DATA.length;i++){
    const r=DATA[i];
    if(mr && r[5]!==mr) continue;
    const has = saved.has(r[7]);
    if(est==="ok" && !has) continue;
    if(est==="pend" && has) continue;
    if(toks.length && !toks.every(t=>IDX[i].includes(t))) continue;
    out.push(r);
  }
  return out;
}
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const showDate = value => {
  if(!value) return "—";
  const date = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(value));
  return esc(date ? `${date[3]}/${date[2]}/${date[1]}` : value);
};

function render(){
  const list=filtered(), pages=Math.max(1,Math.ceil(list.length/PAGE));
  if(page>=pages) page=pages-1;
  const slice=list.slice(page*PAGE,page*PAGE+PAGE);
  $("tb").innerHTML = slice.length ? slice.map(r=>{
    const key=r[7], s=saved.get(key); const mine = s && s.by===uid;
    const locked = !canWrite || (s && !mine && !canEdit);
    let cell;
    if(locked){
      cell = s ? `<span class="pill lock">${s.mes}${mine?"":" · registrado"}</span>` : `<span class="sub">Pendiente</span>`;
    } else {
      cell = `<select data-row="${key}" class="${s?"":"pend"}" aria-label="Mes de ${esc(r[2])}" ${pending.has(key)?"disabled":""}>
        <option value="">Elegir mes</option>${MESES.map(m=>`<option${s&&s.mes===m?" selected":""}>${m}</option>`).join("")}</select>`
        + (s ? `<button class="x" data-clear="${key}" type="button" title="Quitar programación">Quitar</button>` : "");
    }
    return `<tr class="${s?"done":""}"><td class="n">${r[1]}</td><td class="nm">${esc(r[2])}</td><td class="sm">${esc(r[3])}</td><td class="sm">${esc(r[4])}</td><td class="sm">${esc(r[5])}</td><td class="sm">${esc(r[6])}</td><td class="sm date">${showDate(r[8])}</td><td class="sm date">${showDate(r[9])}</td><td class="sm date">${showDate(r[10])}</td><td><div class="mes">${cell}</div></td></tr>`;
  }).join("") : `<tr><td colspan="10" class="empty">Sin resultados para este filtro.</td></tr>`;
  $("pInfo").textContent = `${list.length} de ${DATA.length} trabajadores · página ${page+1} de ${pages}`;
  $("prev").disabled = page===0; $("next").disabled = page>=pages-1;
}

function stats(){
  let n=0; const per={}; MESES.forEach(m=>per[m]=0);
  DATA.forEach(r=>{ const s=saved.get(r[7]); if(s){ n++; per[s.mes]=(per[s.mes]||0)+1; }});
  $("cProg").textContent=n; $("barFill").style.width=(100*n/DATA.length)+"%";
  $("months").innerHTML = MESES.map(m=>`<div><span>${m.slice(0,3)}</span><b>${per[m]}</b></div>`).join("");
}

async function claim(key, mes){
  if(!db) return;
  pending.add(key); render();
  try{
    await db.doc("vac/"+key).claim({row:Number(key.slice(1)), mes, by:uid, at:Date.now()}, uid);
    toast("Guardado: "+mes);
  }catch(e){
    if(e.code==="duplicado") toast("⚠ Este trabajador YA EXISTE: fue programado para "+e.mes+" por otra persona. No se duplicó.");
    else if(e.code==="permission-denied") toast("No se pudo guardar: el registro ya existe o no tienes permiso.");
    else toast("No se pudo guardar ("+(e.code||"error")+").");
  }
  finally{ pending.delete(key); render(); }
}
async function clearRow(key){
  try{ await db.doc("vac/"+key).delete(); toast("Programación quitada."); }
  catch(e){ toast("No se pudo quitar ("+(e.code||"error")+")."); }
}

$("tb").addEventListener("change",e=>{
  const sel=e.target.closest("select[data-row]"); if(!sel) return;
  const key=sel.dataset.row;
  if(sel.value) claim(key, sel.value); else if(saved.has(key)) clearRow(key);
});
$("tb").addEventListener("click",e=>{ const b=e.target.closest("[data-clear]"); if(b) clearRow(b.dataset.clear); });
["q","fMr","fEst"].forEach(id=>$(id).addEventListener("input",()=>{page=0;render();}));
$("prev").onclick=()=>{page--;render();}; $("next").onclick=()=>{page++;render();};

/* ---- Exportar a la plantilla original ---- */
const xmlEsc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
async function exportXlsx(){
  const dl = await claude.use("downloads");
  if(!dl){ toast("La descarga no está disponible en esta vista."); return; }
  const btn=$("btnXlsx"); btn.disabled=true;
  try{
    const zip = await JSZip.loadAsync(XLSX_B64,{base64:true});
    const path="xl/worksheets/sheet1.xml";
    let xml = await zip.file(path).async("string");
    const byExcelRow = new Map(DATA.map(r=>[r[0],saved.get(r[7])]));
    xml = xml.replace(/<c r="G(\d+)"([^>]*?)(?:\/>|>[\s\S]*?<\/c>)/g,(m,row,attrs)=>{
      const s=byExcelRow.get(+row); if(!s) return m;
      const st=(attrs.match(/\ss="\d+"/)||[""])[0];
      return `<c r="G${row}"${st} t="inlineStr"><is><t>${xmlEsc(s.mes)}</t></is></c>`;
    });
    zip.file(path, xml);
    const blob = await zip.generateAsync({type:"blob",mimeType:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",compression:"DEFLATE"});
    await dl.save({filename:"PROGRAMACION_DE_VACACIONES_NOMB_-_CAS_DEL_2027_CONSOLIDADO.xlsx", data:blob});
  }catch(e){ if(!e||e.code!=="declined") toast("No se pudo generar el Excel."); }
  finally{ btn.disabled=false; }
}
$("btnXlsx").onclick=exportXlsx;

/* ---- Datos compartidos ---- */
function setRO(msg){ $("roNote").textContent=msg; $("roNote").hidden=!msg; }
(async function start(){
  render(); stats();
  const user = await claude.use("user");
  db = await claude.use("db");
  if(!db || !user){ $("liveState").textContent="Sin conexión"; setRO("No se pudo conectar con la base de datos. Revisa tu conexión a internet y la configuración de Firebase."); return; }
  uid = await user.id();
  const cw = user.can("data.write");
  canWrite = !!uid && cw !== false;
  canEdit = !!user.canEdit();
  if(!canWrite) setRO("Tienes acceso solo de lectura. Pide permiso de Colaborador para registrar meses.");
  const timer=setTimeout(()=>{ $("liveState").textContent="Sin respuesta del servidor…"; },10000);
  db.collection("vac").onSnapshot(snap=>{
    clearTimeout(timer);
    const m=new Map(); let unmatched=0;
    snap.docs.forEach(d=>{
      const v=d.data();
      if(!v || !v.mes || !MESES.includes(v.mes)) return;
      if(employeeKeys.has(d.id)) m.set(d.id, v);
      else unmatched++;
    });
    saved=m; $("liveState").textContent="Sincronizado en la nube"; stats();
    const notes=[];
    if(!canWrite) notes.push("Tienes acceso solo de lectura. Pide permiso de Colaborador para registrar meses.");
    if(unmatched) notes.push(`Se detectaron ${unmatched} programaciones anteriores que no se asociaron automáticamente por cambios o coincidencias ambiguas; siguen conservadas en Firebase y requieren revisión.`);
    setRO(notes.join(" "));
    const a=document.activeElement; if(!(a && a.tagName==="SELECT" && a.closest("#tb"))) render(); else setTimeout(render,0);
  },err=>{ clearTimeout(timer); $("liveState").textContent="Desconectado ("+(err.code||"error")+")"; });
  render();
})();
</script>
</html>
